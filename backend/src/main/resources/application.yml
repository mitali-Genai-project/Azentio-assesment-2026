spring:
  application:
    name: clearlist
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/clearlist}
    username: ${DB_USERNAME:clearlist}
    # No default on purpose: the password must come from the environment (see .env.example)
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # schema is owned by Flyway; Hibernate only checks it
    properties:
      hibernate:
        jdbc:
          batch_size: 100
        order_inserts: true
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 500ms            # keep screening fast if Redis is slow; the cache fails open
      repositories:
        enabled: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}

clearlist:
  matching:
    threshold: ${MATCH_THRESHOLD:0.85}
    token-threshold: ${MATCH_TOKEN_THRESHOLD:0.88}
    max-hits: ${MATCH_MAX_HITS:10}
  cache:
    type: ${CACHE_TYPE:redis}   # redis | memory | none
    ttl: ${CACHE_TTL:PT10M}
  security:
    # No defaults on purpose: set CLEARLIST_ANALYST_PASSWORD / CLEARLIST_SUPERVISOR_PASSWORD (see .env.example)
    analyst-password: ${CLEARLIST_ANALYST_PASSWORD}
    supervisor-password: ${CLEARLIST_SUPERVISOR_PASSWORD}
